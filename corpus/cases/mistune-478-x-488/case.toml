- PR diff SHA256: `25e0875d9ae6c3b31f6622ca4373ba290d1c2ec067b557558d29411329e7af26`
- `src/mistune/plugins/footnotes.py` blob SHA256: `3f1229e3a3fe221dd1038a765184d1626559bbd78acdab40d4845f721b96b474`
- `tests/test_security_footnotes.py` blob SHA256: `790d457821de4913e6b95b7755ab65b4875983c92ce2a9da9bb5bca45919bcfc`

The PR diff digest is the SHA256 of GitHub's `application/vnd.github.diff` response for PR #478; it matches the locally generated base-to-head diff byte-for-byte.
"""

[b]
title = "Preserve code blocks containing indented fence lines"
pr = "https://github.com/lepture/mistune/pull/488"
from = "4c4e57ed1b1588dc159fdf474e0e9e2b547a9c70"
to = "76e00bd1a89057a1483b3603480ecca03aea3e00"
body = """
When converting an indented code block to fenced Markdown, `_get_fenced_marker()` only checks fence characters at column zero. A line such as `  ``` ` (without the trailing space) is a valid closing fence, so the generated Markdown can close the code block early and turn the remaining code into paragraphs.

Allow up to three leading spaces when checking the code for existing fence runs. The captured run still excludes indentation, so choosing a longer fence uses its actual delimiter length.

The regression test reformats indented code containing backtick and tilde fences at zero to three spaces of indentation, then checks that parsing the result yields exactly one code block with the complete content. Nine subcases fail before the fix.

Validation on Linux / Python 3.14.2: 1159 tests and 22 subtests pass with branch coverage enabled; repository-configured Ruff and strict Mypy checks pass, as does `git diff --check`.

"""
