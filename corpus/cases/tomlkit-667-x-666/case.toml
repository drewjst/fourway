[a]
title = "Resolve remaining API documentation reference warnings"
pr = "https://github.com/python-poetry/tomlkit/pull/667"
from = "004fce630d2537542a03fa8d4d6d62dae418b422"
to = "7ab0c794ddb4f7cfe837721365ba7302f769c6ab"
body = """
## Summary

Fixes #192's remaining API documentation warnings after #624. Add a Container target, preserve the existing TOMLDocument members explicitly, render mapping docstrings as prose, and correct the register_encoder literal-block marker. Ignore only named private/internal bases and typing-only targets without API pages.

Validation: fresh Sphinx 7.4.7 HTML and Read the Docs dirhtml builds pass with warnings treated as errors. All 20 existing TOMLDocument anchors remain and generated links resolve. Full suite: 1202 passed. Root repeated the strict HTML build successfully. No runtime behavior changes.

## Agent Drafting Metadata

- Agent: OpenAI Codex with implementation and independent review subagents.
- Model: GPT-6 coordinator; GPT-6 Luna subagents.
- Notes: Agents reproduced the warnings, prepared the documentation changes and PR text, reviewed API/link preservation, and ran validation. An initial inherited-member regression was corrected before submission.

"""

[b]
title = "Speed up array appends"
pr = "https://github.com/python-poetry/tomlkit/pull/666"
from = "9e835438140b2f188205e77ece86d59a94ba9532"
to = "d7def7dbcc59b3b2d11cc73114c31d1f616523a8"
body = """
## Summary

Closes #665.

Appending to an array currently rebuilds all its indexes, even though the existing values haven't moved.

This keeps those indexes and adds the new one for normal tail appends. Middle inserts, special formatting items, and states where the value list and index map have different lengths still use the old rebuild. The value conversion and formatting code are unchanged.

That makes the index work for N normal appends O(N) instead of O(N²). It reuses the existing map, so there isn't another cache to keep in memory.

I checked comments, whitespace, trailing commas, generators, self-extension, edits after appending, and invalid inputs against the old code. All 550 comparisons matched, including 60 errors and the state left after them. The full suite passed: 1,214 tests. The correctness tests also pass with the old method; only the new no-rebuild check needs this change.

Ruff passed. My local mypy 2.4.0 run reports 74 existing errors on both versions, with no new diagnostics. The repo pins an older mypy version, so I'm not counting this as a clean type-check run.

These timings include converting the data and writing the TOML. The file lists use names from Django's source archive. The wheel case uses the 65 wheel records from NumPy 2.5.4, in the same sort of array-building workflow used by [PDM's array helper](https://github.com/pdm-project/pdm/blob/6b9365ea1f45a809ad54b558b2530f8ee2d64586/src/pdm/formats/base.py#L89) and [pylock export](https://github.com/pdm-project/pdm/blob/6b9365ea1f45a809ad54b558b2530f8ee2d64586/src/pdm/formats/pylock.py#L65). This is a constructed workflow, not a measurement of PDM itself.

The larger flat arrays improve clearly. Small arrays and wheel records are mixed, so I wouldn't claim this speeds up every document. All the results are below, including the slower ones.

The expanded run also covers generators, nested tables, edits to existing documents, and lots of separate small arrays. Middle/front inserts and parsing an unchanged document are included as controls.

Measurements: Python 3.15.0, Windows, Intel Core i5-13420H. Each row is the median of five paired timing samples on that same CPU pair. Short calls are batched. Only one process runs, allowed on two physical cores at a time, with the pairs rotated. The masks are kept separate because this CPU has different core types. Run order alternates on successive visits to each pair.

Peak figures are medians of five separate tracemalloc runs, not total process RAM. A separate memory run is shared by the 4 timing rows for a workload. Small timing differences on this laptop should not be treated as guaranteed gains or losses.

Base commit: 19edc23b0244e1546abbf3b7890c3d8a0deeaf81. Fixture loading is outside the warm measurements. The Django archive is version 6.1.2, SHA-256 a1e92451ccb8b514e91bbb3b6d186d20b4030558f116b5d9de6535455ff210b7.

All 26 workloads and 104 table rows are included, including slower results.

<!-- complete: 26/26 workloads -->
