[b]
title = "Render tz-aware times as local times without an offset"
pr = "https://github.com/python-poetry/tomlkit/pull/613"
from = "763bd661bfed068209c03510ae94493eb2db12b5"
to = "ce8f8ee982411c4afef5cfb90df7313cc5f7d779"
body = """
## Summary

`item()` and `Time._new` built the raw literal with `time.isoformat()`, which includes the UTC offset for tz-aware values - e.g. `07:32:00+02:00`. TOML local times have no offset or timezone (the spec's examples are plain `07:32:00`), and this library's own parser rejects the offset, so the serialized document was invalid and could not be read back:

```python
i = item(time(7, 32, tzinfo=timezone(timedelta(hours=2))))
i.as_string()   # before: '07:32:00+02:00'  (rejected by tomlkit.parse)
                # after:  '07:32:00'
```

Render from hour/minute/second/microsecond only. Naive times are byte-for-byte unchanged.

