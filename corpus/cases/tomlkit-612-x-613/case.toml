[a]
title = "Escape content appended to a String via __add__"
pr = "https://github.com/python-poetry/tomlkit/pull/612"
from = "79039653cbe5ff2a2e23042717455a2ac4875539"
to = "61941deb3c7155e88d5f038148b33a599c04a530"
body = """
## Summary

`String.__add__` spliced the appended text into the raw literal without escaping it, so appending a quote or backslash to a basic string produced a literal that is not valid TOML - including to this library's own parser:

```python
i = item(\"foo\")
i += '\"'
i.as_string()   # before: '\"foo\"\"'  (unparseable)
                # after:  '\"foo\\\"\"'
```

Escape the appended plain text with the string type's escape sequences (a `String` operand keeps contributing its already-escaped raw form), mirroring what `from_raw` already does. This is the same class of bug as #231, which fixed the literal round-trip but not `__add__`.

