base = { repo = "tinydb" }
label = "conflict"
expect = "differential_b"
class = "cache maintenance x result order"

[a]
title = "Keep cached searches across inserts"
body = """
Every insert cleared the whole query cache, so a read-heavy table that takes
occasional inserts ran every search again from storage. An insert can only add
to a search result, so insert() now appends the new document to each cached
result whose query matches it and keeps the cache. Other writes still clear it.
"""

[b]
title = "Return search results in document ID order"
body = """
Storages keep documents in insertion order, so a document inserted with an
explicit, lower ID came back after documents with higher IDs. search() now
returns matches sorted by document ID, and the cached copy keeps that order.
"""
