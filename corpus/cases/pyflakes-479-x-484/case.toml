body = """
Resolves #447

There's a couple cases that needed handling here:
- partially quoted annotations (as reported in the original issue)
- annotations which are doubly forward annotations (I don't have a word for this or a document that explains them, but `mypy` handles them fine -- things like `-> \"foo['bar']\"`
- quoted annotations while using `from __future__ import annotations`
"""

