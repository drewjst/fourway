title = "fix: use typing.Self on Python 3.11+ instead of typing_extensions"
pr = "https://github.com/jd/tenacity/pull/576"
from = "a4a725245b264fb71bb0d217bfad867d5da08082"
to = "7efa2fe4bd27f3e1c759482114b8d2dc9df9ff04"
body = """
On Python 3.11+, Self is available in the standard typing module.
Only fall back to typing_extensions for Python 3.10 (under
TYPE_CHECKING only, so no runtime dependency added).

Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
"""

