title = "fix: return \"Self\" from \"BaseRetrying.copy\""
pr = "https://github.com/jd/tenacity/pull/518"
from = "212c47c05fec89c3aca8c4fec0b426c9f33036e8"
to = "bfbf17314612b8546a650c4b56d6c6438e6857df"
body = """
Currently `BaseRetrying.copy` returns `BaseRetrying`, making reusing a \"template\"/base retrying object harder.
Example usecase:
```py
from tenacity import AsyncRetrying


class SomeClient:
    def __init__(self, retry: AsyncRetrying) -> None:
        self._retry = retry

    async def method(self) -> None:
        async for attempt in self._retry.copy():
            with attempt:
                pass  # Do something
```
```sh
$ mypy main.py 
main.py:9: error: \"BaseRetrying\" has no attribute \"__aiter__\" (not async iterable)  [attr-defined]
Found 1 error in 1 file (checked 1 source file)
```
"""

