[b]
title = "Handle malformed collection operands in Version comparisons"
pr = "https://github.com/python-semver/python-semver/pull/479"
from = "1b7350c1a7cacea983ab10b345990fee78761d44"
to = "0aa17a3447958cfe13634b0c3917e7aa4eee3334"
body = """
Comparing a `Version` with a malformed list, tuple, or dictionary leaks errors from the internal constructor. For example, `Version(1, 0, 0) == []` raises `TypeError` even though equality with unsupported operands should evaluate to `False`.

Convert collection operands in the comparison decorator and return `NotImplemented` when construction raises `TypeError` or `ValueError`. Equality then returns `False`, and ordering raises Python's standard unsupported-comparison `TypeError`. Valid collections and subclass behavior are preserved; `Version.compare()` and string parsing are unchanged.

The patch adds 19 regression cases, updates the documentation's comparison example, and includes `changelog.d/pr479.bugfix.rst` using the actual PR number as documented by `changelog.d/README.rst`.

Validation against base `1e8757912f633684e1a65d9d7c7e2270c3c79928`, reproduced independently in clean checkouts:

