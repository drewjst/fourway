[b]
title = "fix: guard against None seconds_since_start in after_log"
pr = "https://github.com/jd/tenacity/pull/591"
from = "6be363b0439bd213dd5ea4cb0c0c184bf616232a"
to = "213446e8f5f73ca0d20e22ec8ee38b1f75a45434"
body = """
`RetryCallState.seconds_since_start` returns None when
`outcome_timestamp` is not set. The `%` format operator in `after_log`
would crash with a TypeError in this case. Fall back to \"?\" when the
value is None.

Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
"""
