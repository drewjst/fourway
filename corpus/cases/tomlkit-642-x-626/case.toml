- Agent: Qoder (AI coding assistant), autonomous contribution
- Model: not disclosed by the agent host
- Notes: diagnosis and patch drafted with the assistant; every number above comes from commands run on this checkout. AI-assisted development. Human review requested before merge.

"""

[b]
title = "Keep fold when unwrapping a datetime or time"
pr = "https://github.com/python-poetry/tomlkit/pull/626"
from = "c07c0c15c49a893bb8a4c9f63401822d31e08942"
to = "89cdcc7845da111e5d6b7eb0c1823684a274711a"
body = """
## Summary

`DateTime.unwrap()` and `Time.unwrap()` rebuilt the stdlib value without `fold`. A folded 01:30 then converted an hour early (`timestamp()` was 3600 seconds off). `==` still passed, because datetime equality ignores `fold`.

## Test plan

- [x] `pytest tests/test_items.py::test_unwrap_keeps_fold` fails on master (`fold` is 0) and passes with this change
- [x] `pytest tests/test_items.py` (101 passed)

